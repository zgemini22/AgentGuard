[project]
name = "agentguard-mcp"
version = "0.2.0"
description = "A minimal-privilege proxy for MCP tool calls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/zgemini22/AgentGuard"
Repository = "https://github.com/zgemini22/AgentGuard"
Changelog = "https://github.com/zgemini22/AgentGuard/blob/main/CHANGELOG.md"
Issues = "https://github.com/zgemini22/AgentGuard/issues"

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
agentguard = ["policies/*.yaml"]
