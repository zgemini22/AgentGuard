[project]
name = "agentguard-mcp"
version = "0.1.1"
description = "A minimal-privilege proxy for MCP tool calls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/zgemini22/AgentGuard"
Issues = "https://github.com/zgemini22/AgentGuard/issues"

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]
