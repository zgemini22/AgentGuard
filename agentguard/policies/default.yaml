# AgentGuard policy: file / command / network rules.
# Patterns are matched against tool-call arguments. Which category an
# argument belongs to comes from the tool's declared inputSchema (seen
# on tools/list) when there is one, and from key-name conventions
# otherwise — see agentguard/classify.py.

# What to do with a string argument the classifier can't place in any
# category. `allow` (the default, and the v1 behavior) lets it through
# unchecked — which is exactly the rename-the-argument bypass. `deny` is
# the secure setting: a call is rejected if any string argument is
# unclassified. It's only livable once your server's schemas are good
# enough that everything you care about classifies; run
#   agentguard check-policy --probe <tool> '<json-args>'
# against real calls before flipping it. Either way, the audit entry
# records the category as "unclassified" so the gap is visible.
unclassified_arguments: allow

# Where `ask` verdicts go. Any deny pattern may be written as
#   - pattern: "**/.env"
#     action: ask
# and default_action / unclassified_arguments / budgets.on_exceed /
# sequences.on_trip accept `ask` too. With approval_socket set, the
# proxy listens on that Unix socket and `agentguard approve --socket
# <path>` in another terminal shows each pending call and takes
# deny / once / session / always. Without it (or on a platform without
# Unix sockets) every ask is denied, and the audit entry says why.
# approval_socket: /tmp/agentguard-approve.sock
# approval_timeout: 60      # seconds an ask waits before it is denied
#
# Where an operator's `always` answers are written. This file is NOT
# the policy — it's an overlay of grants, loaded after the policy and
# shown separately by check-policy, so "always" under time pressure
# can never quietly weaken the trust root. Unset: `always` behaves as
# `session`. Each grant is one scope (tool:category:rule-or-value).
# grants_file: agentguard_grants.yaml

# Periodic anchoring of the audit chain: every anchor_every entries the
# proxy appends "<ts> <count> <head-hash>" to anchor_file. Verify with
# `agentguard verify-audit <log> --anchor-file <file>`. An anchor only
# catches a rewritten log if the attacker couldn't also edit the
# anchor — put this file somewhere else (another host, an append-only
# store), or use `agentguard anchor` and keep the line yourself.
# anchor_file: /somewhere/else/agentguard_anchors.txt
# anchor_every: 100

file_access:
  enabled: true
  deny_patterns:
    - "~/.ssh/**"
    - "**/.ssh/**"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/.env"
    - "**/.env.*"
    - "**/.aws/credentials"
    - "**/.aws/config"
    - "**/*.pem"
    - "**/*.key"

command_exec:
  enabled: true
  deny_patterns:
    - "\\brm\\s+(-{1,2}[\\w-]+\\s+)*(/|/\\*|~/?|\\$HOME/?)(\\s|$)"
    - "\\bcurl\\b[^|\\n]{0,512}\\|\\s*(sudo\\s+)?(sh|bash|zsh|dash|ksh|python[23]?|perl|ruby|node)\\b"
    - "\\bwget\\b[^|\\n]{0,512}\\|\\s*(sudo\\s+)?(sh|bash|zsh|dash|ksh|python[23]?|perl|ruby|node)\\b"
    - ":\\(\\)\\s*\\{\\s*:\\|\\s*:\\s*&\\s*\\}\\s*;"

network:
  enabled: true
  allow_patterns:
    - "*.github.com"
    - "api.anthropic.com"
    - "*.anthropic.com"
    - "pypi.org"
    - "*.pypi.org"
    # example.com/*.example.com is reserved for documentation and
    # testing (RFC 2606) — allowed here so demo/run_demo.sh's fetch_url
    # scenario doesn't need a real, separately-allowlisted domain.
    - "*.example.com"
  default_action: deny

# Per-tool overrides. A tool's effective rules are the global sections
# above with each *field* set here replaced — `tools.fetch.network.
# allow_patterns` narrows the allowlist for that one tool and inherits
# everything else (deny_patterns, default_action) from the global
# network section. `enabled: false` switches a tool off entirely;
# `unclassified_arguments` can be set per tool. Commented out because
# tool names are server-specific.
# tools:
#   fetch_url:
#     network:
#       allow_patterns: ["api.github.com"]
#   run_command:
#     enabled: false
#   read_file:
#     file_access:
#       allow_patterns: ["/project/**"]
#       default_action: deny
#     unclassified_arguments: deny

# Session budgets: ceilings a single proxy run can't exceed however each
# individual call looks. The cheap, deterministic answer to incremental
# exfiltration ("read one more file, then one more...") and to a tool
# that returns a 50 MB blob. A call over a per-category ceiling is
# denied on the way in with the budget named; a result over
# max_output_bytes_per_call is withheld; once max_total_output_bytes
# has been delivered, every further call is denied. Only forwarded
# calls and delivered bytes count. All keys optional — unset means
# unlimited. Commented out here because the right numbers depend on
# the workload; these are a starting point for an interactive agent.
# budgets:
#   max_file_calls: 500
#   max_network_calls: 100
#   max_command_calls: 200
#   max_output_bytes_per_call: 2000000
#   max_total_output_bytes: 50000000

# Sequence rules: the three cross-call questions a session can answer.
# Exactly three, by design — each is a named pattern with fixed
# semantics, not a rule language.
#   deny_network_after_sensitive_read — once a file matching a
#     sensitive pattern has been read (allowed, not denied — deny
#     patterns never let it through), no network call goes out for the
#     rest of the session. Omit sensitive_patterns to use the built-in
#     list (agentguard.policy.DEFAULT_SENSITIVE_PATTERNS: .env, key and
#     certificate files, cloud/SSH credential directories, ...).
#   max_distinct_directories — a ceiling on how many different parent
#     directories a session's file calls may touch.
#   deny_exec_after_fetch — once any network call has gone through, no
#     command runs for the rest of the session.
# Commented out because they change what a working session may do;
# the first one is the safest to turn on.
# sequences:
#   deny_network_after_sensitive_read:
#     enabled: true
#   max_distinct_directories: 20
#   deny_exec_after_fetch: false

# Redaction runs on tool *output*, after a call has already been allowed
# through by the rules above — a call can be legitimate and still return
# something (a checked-in .env dump, a token embedded in an API
# response) that shouldn't reach the agent's context unmasked.
# Omit `rules` entirely to use agentguard.redact.DEFAULT_RULES.
redaction:
  enabled: true
  rules:
    - name: aws_access_key_id
      pattern: "AKIA[0-9A-Z]{16}"
    - name: aws_secret_access_key
      pattern: "(?i)aws_secret_access_key[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9/+=]{40}"
    - name: github_token
      pattern: "gh[pousr]_[A-Za-z0-9]{36,255}"
    - name: slack_token
      pattern: "xox[baprs]-[A-Za-z0-9-]{10,255}"
    - name: private_key_block
      pattern: "-----BEGIN[ A-Z]{0,40}PRIVATE KEY-----(?:[^-]|-(?!----)){0,16384}-----END[ A-Z]{0,40}PRIVATE KEY-----"
    - name: jwt
      pattern: "(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{1,4096}\\.[A-Za-z0-9_-]{1,8192}\\.[A-Za-z0-9_-]{1,8192}"
    - name: generic_api_key
      pattern: "(?i)(api[_-]?key|secret|token)[\"']?\\s{0,16}[:=]\\s{0,16}[\"'][A-Za-z0-9_\\-]{16,512}[\"']"

# Injection detection also runs on tool *output*, before redaction. It
# looks for instruction-shaped text (the poisoned-webpage/poisoned-doc
# attack: fetched content trying to redirect what the agent does next)
# rather than secret formats. A hit blocks the whole tool result instead
# of masking a span, since the injected instruction can't be safely left
# next to real content. Omit `rules` to use agentguard.injection.DEFAULT_RULES.
injection_detection:
  enabled: true
  rules:
    - name: ignore_instructions
      pattern: "ignore\\s+(all\\s+)?(previous|prior|above|earlier)\\s+instructions"
    - name: disregard_instructions
      pattern: "disregard\\s+((your|all|previous|prior)\\s+)+(instructions|rules|guidelines|prompt)"
    - name: new_instructions_marker
      pattern: "(?:#{1,3}[ \\t]*|\\b)(new|updated|admin|system|override)\\s+instructions\\s*:"
    - name: role_override
      pattern: "you\\s+are\\s+now\\s+(a|an)\\b"
    - name: reveal_system_prompt
      pattern: "(reveal|print|show|output)\\s+(your\\s+)?(system\\s+prompt|full\\s+instructions|initial\\s+prompt)"
    - name: exfiltrate_secret
      pattern: "(send|post|email|upload|forward|exfiltrate|transmit)\\s+(the\\s+|the\\s+user'?s\\s+|your\\s+)?(ssh\\s+key|api\\s+key|password|credentials?|secrets?|tokens?|private\\s+key)s?\\s+to\\b"
    - name: pipe_to_shell
      pattern: "\\b(curl|wget)\\b[^|\\n]{0,512}\\|\\s*(sudo\\s+)?(sh|bash|zsh|dash|ksh|python[23]?|perl|ruby|node)\\b"
